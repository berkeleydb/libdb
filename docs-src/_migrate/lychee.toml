# lychee link-check config for the generated docs site (docs-build/html).
#
# The docs INTERNAL link gate is HARD: every link to migrated content must
# resolve. The excludes below are the only known dangling targets, and NONE is
# a migration regression:
#   - CXX / java / com/sleepycat: language-binding API trees deliberately NOT
#     migrated (see docs-src/PLAN.md "Deferred"); links into them dangle until
#     a future phase regenerates them from source.
#   - build_vxworks / build_wince: dead in the UPSTREAM DocBook too (VxWorks /
#     WinCE build pages were referenced but never shipped) -- pre-existing, not
#     introduced by the migration.
# When a deferred tree is migrated, drop its line here so its links re-enter
# the gate.
#
# Usage (internal only, offline):
#   lychee --offline --config docs-src/_migrate/lychee.toml "docs-build/html/**/*.html"
# External links are advisory and checked separately (scheduled), not here.

exclude = [
  "/api_reference/CXX/",
  "/api_reference/TCL/",
  "/guides/java/",
  "/java/com/sleepycat/",
  "build_vxworks",
  "build_wince",
  # Bundled external assets referenced by the programmer's reference but not
  # migrated into docs-src (they live only in the source docs/ tree): the
  # USENIX papers (*.pdf), the example C listings (transapp.cs / writetest.cs),
  # and a sample tuning file (solaris.txt). A later phase can copy these in;
  # until then their links dangle and are not a migration regression.
  "_usenix.pdf",
  "BDB_Prog_Reference.pdf",
  "transapp.cs",
  "writetest.cs",
  "solaris.txt",
]

# Internal-only run: skip all network schemes so a PR gate never depends on the
# reachability of external sites (those are an advisory, scheduled job).
scheme = ["file"]
