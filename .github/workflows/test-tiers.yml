# Isolation, resource-accounting and lock-mode test tiers.
#
# These three tiers close a structural blind spot: the existing suite is strong
# on crash/durability (test/sim) and on memory safety against malformed input
# (test/fuzz), but was blind to (a) isolation semantics as a checkable property
# and (b) long-running resource accounting.  Five external bug reports
# (#136-#140) landed on v5.3.34 through that gap.
#
#   B1  test/isolation/  serializability checker -- would have caught #136,
#                        plus two SSI mechanism gates (marker-GC missed
#                        conflict, and pivot durability across a crash in the
#                        commit window)
#   B2  test/soak/       resource-accounting soak -- would have caught #137/#138
#   B3  test/lockmatrix/ lock-mode matrix under ASan -- would have caught #140
#
# Gating policy follows the house style:
#   - B1 is a HARD GATE on every push/PR.  It is fast (~1 min) and its
#     expectations are self-correcting: the checker fails both when a new
#     serializability violation appears AND when a scenario marked as
#     reproducing a known issue stops violating, so a fix cannot land without
#     updating the expectation.
#   - B3 is a HARD GATE.  It was advisory while #140 was open (on that master it
#     legitimately aborted under ASan -- that abort WAS the #140 reproduction);
#     #145 fixed the lock-list sizing, so the matrix passes and any future ASan
#     fault in the lock list is a real regression.
#   - B2 (soak) is scheduled/nightly plus manual dispatch: it is a long run.  It
#     was advisory while #137/#138 were open; those are fixed, so when it runs it
#     is a hard gate.

name: Test tiers (isolation / soak / lock matrix)

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'test/isolation/**'
      - 'test/soak/**'
      - 'test/lockmatrix/**'
      - 'test/c/flag_behaviour.c'
      - 'test/c/flag-run.sh'
      - 'src/lock/**'
      - 'src/txn/**'
      - 'src/mp/**'
      - 'src/os/**'
      - 'src/log/**'
      - 'dist/**'
      - '.github/workflows/test-tiers.yml'
  schedule:
    # Nightly (04:41 UTC), offset from ci.yml's 03:17 so the runners do not
    # contend.  This is when the soak tier runs.
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      soak_n:
        description: 'Transactions per soak workload'
        default: '5000'

concurrency:
  group: test-tiers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Tier B1 -- isolation / anomaly checker.  Hard gate: fast and deterministic
  # enough to run per push.
  # --------------------------------------------------------------------------
  isolation:
    name: B1 isolation/anomaly checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev

      # --enable-diagnostic (not just --enable-debug): the SSI commit-window
      # crash gate reaches its in-commit kill points through a DIAGNOSTIC-only
      # hook in src/txn/txn.c.  Without it run.sh reports SKIP for that gate
      # and the pivot-durability property goes untested.
      - name: Build libdb (diagnostic, so DB_ASSERTs and the SSI crash hook are live)
        working-directory: build_unix
        run: |
          ../dist/configure --enable-debug --enable-diagnostic
          make -j"$(nproc)"

      # Runs the anomaly scenarios at both isolation levels AND the two SSI
      # mechanism gates: marker GC must not drop a SIREAD marker early (a
      # MISSED conflict, silent non-serializable commit) and a pivot must not
      # survive a crash inside its commit window.
      #
      # ISO_PARTS sweeps the lock-partition count, and the 1-partition pass is
      # a regression gate rather than tuning: the lock, txn and log "regions"
      # all set mtx_region to the SAME mutex (renv->mtx_regenv), and
      # LOCK_SYSTEM_LOCK acquires it only at part_t_size == 1 -- so that is the
      # one configuration where LOCK_SYSTEM_LOCK and TXN_SYSTEM_LOCK are one
      # non-recursive latch and a nested acquisition self-deadlocks.  The SSI
      # rw-conflict branch in __lock_get_internal did exactly that; every SSI
      # schedule here drives it.  1 partition is supported and is the default
      # on a single-CPU machine, so it is user-reachable.  The drivers arm a
      # watchdog so a hang FAILS by name instead of timing the job out.
      - name: Run the anomaly scenarios and the SSI mechanism gates
        working-directory: test/isolation
        run: ISO_TIMEOUT=600 ISO_PARTS="default 1" ./run.sh

      # ---------------------------------------------------------------------
      # DID THE TESTS THIS TIER PROMISES ACTUALLY RUN?  test/MANIFEST lists
      # them; the runner emits a RESULT line per test it executed.  A missing
      # line fails here.  Four vacuous-green defects landed in one release
      # cycle because an exit status cannot tell "passed" from "never ran".
      # `--tier isolation` makes the tier's own ABSENCE fatal too: this step
      # only runs because the tier just ran, so no results file means the
      # runner produced no evidence at all.
      # ---------------------------------------------------------------------
      - name: Manifest gate (assert every expected test produced a verdict)
        if: always()
        run: ./test/check_manifest.sh --tier isolation

      - name: Upload verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolation-verdicts
          path: test/.results/*.results
          if-no-files-found: ignore

      - name: Upload scenario databases on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: isolation-artifacts
          path: |
            test/isolation/build/ISODIR.*/**
            test/isolation/build/gc-*/**
            test/isolation/build/crash-*/**
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  # Tier B3 -- lock-mode matrix under ASan.  A HARD GATE since #145 fixed the
  # __lock_vec lock-list sizing (#140): the matrix passes, so any ASan fault in
  # the lock list is now a real regression.
  # --------------------------------------------------------------------------
  lock-matrix:
    name: B3 lock-mode matrix (ASan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm liburing-dev
          clang --version

      - name: Run the lock-mode matrix (builds an ASan libdb once)
        working-directory: test/lockmatrix
        run: |
          # Pipe-to-tee would mask the driver's exit status behind tee's, and
          # an ASan abort is exactly the signal we must not lose.  Capture the
          # status explicitly and re-raise it after the summary step has run.
          set -o pipefail
          CC=clang LOCK_TIMEOUT=900 ./run.sh 2>&1 | tee matrix.log

      # An ASan abort kills the driver mid-section.  Without the manifest gate
      # a section that never got to run is indistinguishable from one that
      # passed; run.sh now invokes each section separately and emits a verdict
      # per section, so this names which of the three is missing.
      - name: Manifest gate (assert every section produced a verdict)
        if: always()
        run: ./test/check_manifest.sh --tier lockmatrix

      - name: Summarise
        if: always()
        working-directory: test/lockmatrix
        run: |
          if grep -q 'AddressSanitizer' matrix.log; then
            echo "::warning::Tier B3 reproduced an ASan fault in the lock list"
            echo "Last shape attempted before the fault:"
            grep -E '^    (PUT_READ|UPGRADE_WRITE)' matrix.log | tail -1
            grep -m1 'SUMMARY: AddressSanitizer' matrix.log || true
          fi

      - name: Upload matrix log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lock-matrix-log
          path: |
            test/lockmatrix/matrix.log
            test/.results/*.results
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  # Tier B2 -- resource-accounting soak.  Scheduled/manual only: it is a long
  # run (thousands of sequential transactions per workload).
  # --------------------------------------------------------------------------
  soak:
    name: B2 resource-accounting soak
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev

      - name: Build libdb (debug)
        working-directory: build_unix
        run: |
          ../dist/configure --enable-debug
          make -j"$(nproc)"

      - name: Soak
        working-directory: test/soak
        run: |
          set -o pipefail   # do not let tee mask a failing soak
          SOAK_N="${{ github.event.inputs.soak_n || 5000 }}" \
          SOAK_TIMEOUT=2400 ./run.sh 2>&1 | tee soak.log

      - name: Summarise growth
        if: always()
        working-directory: test/soak
        run: |
          echo "== slopes that exceeded tolerance =="
          grep -E 'GROWING|ENOMEM' soak.log || echo "(none)"

      # The soak tier is scheduled/dispatch-only, so its manifest entries are
      # `optional` -- but once it HAS run, a partial set of workloads is a real
      # finding, and --tier makes a missing results file fatal here (this step
      # only exists on the path where the tier just ran).
      - name: Manifest gate (assert every workload produced a verdict)
        if: always()
        run: ./test/check_manifest.sh --tier soak

      - name: Upload growth curves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-growth-curves
          path: |
            test/soak/soak.log
            test/.results/*.results
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  # Resource-accounting / correctness leak drivers (test/c/leak-run.sh).
  #
  # FINDING: this tier was invoked by NO workflow.  Its five drivers -- the #137
  # locker-reclaim gate, the #138 mutex-slot gate, the #138 mvcc_purge_visible
  # CORRECTNESS gate, the operator health signals, and the os_aio cross-reap
  # durability gate -- were built by `make leak_tests` and run only by hand.
  # Three of the four historical vacuous-green traps lived in this one script.
  # --------------------------------------------------------------------------
  leak:
    name: resource-accounting + correctness leak drivers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev

      # --enable-diagnostic: without it the os_aio cross-reap gate cannot fire
      # __memp_aio_drain's DB_ASSERT(w[j].done), which is the assertion that
      # actually reproduced the durability bug.
      - name: Build libdb (diagnostic)
        working-directory: build_unix
        run: |
          ../dist/configure --enable-debug --enable-diagnostic
          make -j"$(nproc)"

      - name: Run the leak / correctness drivers
        working-directory: test/c
        run: TIMEOUT=300 AIO_SECONDS=20 sh ./leak-run.sh

      # RFC 0007's optimistic read path is safe only because BH.gen is bumped
      # at every exclusive acquisition.  opt_teeth.sh proves that by REBUILDING
      # a sabotaged library with the bump removed and requiring the probe to
      # FAIL.  It ran only by hand when written -- which is exactly how
      # leak-run.sh went two releases without CI ever executing it.
      - name: Optimistic-read validation teeth (RFC 0007)
        working-directory: test/bench
        run: BUILD=../../build_unix sh ./opt_teeth.sh -s 3

      - name: Manifest gate (assert every driver+mode produced a verdict)
        if: always()
        run: ./test/check_manifest.sh --tier leak && ./test/check_manifest.sh --tier bench

      - name: Upload verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leak-verdicts
          path: test/.results/*.results
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  # Runtime I/O and durability FLAG BEHAVIOUR (test/c/flag-run.sh).  Gap G15.
  #
  # DB_DIRECT, DB_DIRECT_DB, DB_DSYNC_DB, DB_LOG_DIRECT, DB_LOG_DSYNC,
  # DB_LOG_WRNOSYNC and DB_NOSYNC were referenced by ZERO tests.  The one test
  # that mentioned DB_DIRECT_DB asserted only that set_flags ACCEPTED it -- which
  # is how defect P2 shipped: a documented flag under which no database can be
  # opened at all, while the coverage counter went up.
  #
  # This job asserts observable consequences: O_DIRECT / O_DSYNC read back from
  # /proc/self/fdinfo on the descriptor the library actually opened, and sync
  # COUNTS compared between two arms.  --enable-o_direct is required for the
  # O_DIRECT modes, so it is configured here; without it those modes SKIP with
  # the reason printed, which is the state this job exists to prevent.
  #
  # HARD GATE.  direct_db and direct_log report XFAIL against P2 today (an
  # expectation that held, which harness.sh counts as a pass); they become PASS
  # when P2 is fixed, with no edit to the test.  The teeth of that arrangement
  # are demonstrated by the FLAGB_STRICT=1 step below, which refuses the XFAIL
  # allowance and MUST fail on a tree where P2 is present -- a gate that can
  # only ever pass is indistinguishable from a gate that does nothing.
  # --------------------------------------------------------------------------
  flagbehaviour:
    name: runtime I/O + durability flag behaviour (G15)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install strace (the DB_NOSYNC assertion IS a syscall count)
        run: |
          sudo apt-get update
          sudo apt-get install -y strace liburing-dev

      # --enable-o_direct: without it __os_support_direct_io() returns 0,
      # set_flags(DB_DIRECT_DB) correctly returns EINVAL, and every O_DIRECT
      # mode skips.  This is the ONLY CI job that builds that option.
      - name: Build libdb (--enable-o_direct)
        working-directory: build_unix
        run: |
          ../dist/configure --enable-o_direct --enable-diagnostic
          make -j"$(nproc)"

      - name: Flag behaviour tests
        working-directory: test/c
        run: TIMEOUT=300 ./flag-run.sh

      - name: Manifest gate (assert every flag mode produced a verdict)
        if: always()
        run: ./test/check_manifest.sh --tier flag

      # TEETH, the other direction.  FLAGB_STRICT=1 refuses the P2 XFAIL
      # allowance, so this step MUST fail while P2 is open.  If it ever
      # succeeds, either P2 was fixed (then delete this step and the XFAIL
      # branch in flag-run.sh) or the test stopped asserting anything.
      #
      # Runs with its own results directory so it cannot overwrite the verdicts
      # the manifest gate above just checked.
      # P2 turns out to be FILESYSTEM-DEPENDENT, which this very step discovered:
      # it reproduces on XFS over NVMe (where the benchmark ran) and NOT on the
      # GitHub runner, where direct_db reports PASS with O_DIRECT confirmed set.
      # XFS enforces O_DIRECT buffer alignment strictly; this runner's filesystem
      # does not reject the unaligned buffer.  So this cannot be a hard gate in
      # either direction on a runner whose filesystem we do not control: asserting
      # "must fail" breaks on any fs that tolerates it, and asserting "must pass"
      # would hide P2 everywhere.
      #
      # Report the observation, do not gate on it.  The real teeth for P2/P3 live in
      # the nightly big-box job, which runs on XFS where the defect reproduces.
      # This step records which behaviour this runner exhibits, so a future change
      # of runner image is visible rather than silent.
      - name: Teeth -- P2 allowance refused (informational; filesystem-dependent)
        continue-on-error: true
        working-directory: test/c
        run: |
          if LIBDB_RESULTS_DIR="$PWD/../.results-strict" \
              FLAGB_STRICT=1 TIMEOUT=300 ./flag-run.sh; then
            echo "NOTE: FLAGB_STRICT=1 PASSED on this runner."
            echo "This filesystem does not enforce O_DIRECT buffer alignment, so"
            echo "P2/P3 do not reproduce here.  That is an observation about the"
            echo "runner, not evidence P2 is fixed -- it reproduces on XFS."
          else
            echo "OK: FLAGB_STRICT=1 failed -- P2/P3 reproduce on this filesystem."
          fi

      - name: Upload verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flag-verdicts
          path: |
            test/.results/*.results
            test/c/flag-run/*/out.txt
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  # API FLAG BEHAVIOUR, second wave (test/c/flagapi-run.sh).
  #
  # test/TESTING-PROGRAM.md measured the whole flag surface and
  # found 112 of 229 public API flags (48%) referenced by NO test.  The
  # flagbehaviour job above covers seven of them; this job covers the next two
  # priority bands, in defect-yield order: backup/archive first (DB_ARCH_REMOVE
  # UNLINKS LOG FILES, DB_BACKUP_NO_LOGS decides whether a backup is
  # recoverable), then everything else that can be given an observable
  # consequence.
  #
  # HARD GATE, and the teeth step is a hard gate TOO -- which the flagbehaviour
  # job's cannot be.  That difference is the point:
  #
  #   P2/P3 are FILESYSTEM-DEPENDENT (they reproduce on XFS and not on the
  #   GitHub runner's filesystem), so "FLAGB_STRICT=1 must fail" is not a
  #   property of the code and that step is informational.
  #
  #   P6, P7 and P8 are not filesystem-dependent at all.  P6 is a missing
  #   implementation (the flag is read nowhere in src/); P7 is an unbounded
  #   retry loop in __qamc_get; P8 is an unconditional `return (0)` in
  #   LAST_PANIC_CHECK_BEFORE_IO.  All three reproduce anywhere the library
  #   builds, 100% deterministically.  So FLAGAPI_STRICT=1 MUST fail here, and
  #   this job asserts it does.  A gate demonstrated in only one direction can
  #   be completely broken and look fine.
  #
  # No build options and no strace: everything here runs against a stock
  # configure, which is why every flagapi entry in test/MANIFEST is mandatory.
  # --------------------------------------------------------------------------
  flagapi:
    name: API flag behaviour -- archive/backup/sequence/stat/verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install tcl (configure wants it) + liburing
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl-dev liburing-dev

      - name: Build libdb (stock configure)
        working-directory: build_unix
        run: |
          ../dist/configure
          make -j"$(nproc)"

      - name: API flag behaviour tests
        working-directory: test/c
        run: TIMEOUT=300 ./flagapi-run.sh

      - name: Manifest gate (assert every flagapi mode produced a verdict)
        if: always()
        run: ./test/check_manifest.sh --tier flagapi

      # TEETH, the must-fail direction -- a HARD gate, unlike the P2 one above.
      #
      # Three XFAILs are open (P6, P7, P8) and none is environment-dependent, so
      # refusing the XFAIL allowance MUST fail.  If this step ever SUCCEEDS,
      # exactly one of two things happened: an engine fix landed (then remove
      # the matching XFAIL branch, this step's expectation, and the MANIFEST
      # note), or the tests stopped asserting anything.  Both need a human, so
      # both fail the build.
      #
      # `!` inverts the status; a separate results directory so this run cannot
      # overwrite the verdicts the manifest gate just checked.
      - name: Teeth -- FLAGAPI_STRICT=1 must FAIL while P6/P8 are open
        working-directory: test/c
        run: |
          log=/tmp/flagapi-strict.log
          if LIBDB_RESULTS_DIR="$PWD/../.results-strict" \
              FLAGAPI_STRICT=1 TIMEOUT=300 ./flagapi-run.sh 2>&1 | tee "$log" &&
              ! grep -q "TESTS FAILED" "$log"; then
            echo "::error title=Flag-behaviour teeth::FLAGAPI_STRICT=1 PASSED."
            echo "Two engine defects are recorded as XFAIL (P6 DB_BACKUP_NO_LOGS"
            echo "and P8 DB_NOFLUSH), and neither of them depends on"
            echo "the filesystem or the runner -- so refusing the XFAIL allowance"
            echo "MUST fail.  Either a fix landed (remove the XFAIL branch, this"
            echo "step's expectation and the MANIFEST note) or these tests stopped"
            echo "asserting anything.  Both need a human."
            exit 1
          fi
          # It must fail for the RIGHT reason.  A compile error, a missing
          # library or a crashed driver also make the run fail, and reading any
          # of those as "the gate has teeth" is the exact vacuous-green shape
          # this project has nine recorded instances of.  So require each of the
          # three refused XFAILs to appear by name.
          missing=
          for m in backup_nologs noflush@noflush; do
            grep -q -- "--- $m: FAIL (XFAIL refused" "$log" || missing="$missing $m"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Flag-behaviour teeth::the strict run failed, but"
            echo "not on the expected modes:$missing did not report a refused"
            echo "XFAIL.  The run failed for some OTHER reason (build break,"
            echo "crash, missing dependency), so this proves nothing about the"
            echo "tests' teeth."
            exit 1
          fi
          echo "OK: FLAGAPI_STRICT=1 failed on exactly P6/P8 -- teeth confirmed."

      - name: Upload verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flagapi-verdicts
          path: |
            test/.results/*.results
            test/c/flagapi-run/*/out.txt
          if-no-files-found: ignore
