# Release notes for the landing page (libdb.org/) release table.
#
# The LIST of releases and the "latest" pointer are derived automatically from
# git tags at docs build time (build.py build_site: every tag matching v2026.*
# plus the two historical anchors below, newest first). This file supplies the
# one-line note shown next to each. A release with no entry here still appears
# in the table with an empty note, so a new tag can never silently drop off the
# page -- but add its line here when you cut it.
#
# Order within the table is by tag (CalVer sorts correctly); the two non-CalVer
# historical anchors are pinned to the bottom via `historical`.

# Historical (non-CalVer) anchors pinned to the bottom of the table, in order.
historical = ["v5.3.28", "v4.6.21-SSI"]

[notes]
"v2026.09.9" = "Defect fixes found by the new gates: <code>--disable-mutexsupport</code> had never built (three stacked defects) and <code>DB_DIRECT_DB</code> could not open a database (unaligned metadata buffer, latent on tolerant kernels)"
"v2026.09.8" = "Release-machinery correctness: the meson and autoconf builds now agree on the version triplet (meson previously could not attach an autoconf-created environment), <code>s_perm</code> no longer aborts before restoring exec bits, five duplicate message ids renumbered, and the source checkers actually run"
"v2026.09.7" = "RFC 0007 optimistic read-path validation (<strong>2.05&times;</strong> batched reads at 96 threads, environment signature unchanged); T1 SSI marker GC margin and S1 os_aio deadlock fixed; read-descent locks and the write convoy both re-measured and redirected"
"v2026.09.6" = "<code>lk_partitions=1</code> self-deadlock (default on 1-CPU hosts); <code>db_get_multiple()</code> 2.47&times; concurrent reads; harness-integrity + region-signature gates"
"v2026.09.5" = "os_aio cross-reap durability fix, <code>st_nsnapshot</code> underflow, operator health signals, global-invariants note"
"v2026.09.4" = "#137 locker accounting (bounded), <code>ssi_abort_bench</code> SI/SSI distinction, versioning covenant"
"v2026.09.3" = "<code>DB_TXN_SNAPSHOT</code> restored to plain SI + new <code>DB_TXN_SERIALIZABLE</code>; os_aio durability fix; #138 MVCC-retention purge"
"v2026.09.2" = "Cursor-queue sharding (concurrent read scaling); two-site replication-isolation harness"
"v2026.09.1" = "Queue cursor read-path DoS bound"
"v2026.09"   = "Correctness: SSI commit-window write skew (#136), IV entropy from OS CSPRNG, heap OOB write (#140)"
"v2026.08"   = "Serializable snapshot isolation available by default"
"v2026.07.3" = "Testing depth: DST fault-class parity + formal verification (CBMC), PBT hardening"
"v2026.07.2" = "Coverage &amp; correctness: full-suite coverage to the mid-70s, several bug fixes"
"v2026.07.1" = "Testing &amp; hardening: fuzzing, malloc-injection, 10 bug fixes"
"v2026.07"   = "SSI hardening, build hygiene"
"v2026.04"   = "First community fork release"
"v5.3.28"    = "Berkeley DB 11gR2 (11.2.5.3.28) &mdash; the last Oracle open-source release"
"v4.6.21-SSI" = "Cahill SSI prototype (SIGMOD 2008), historical"

